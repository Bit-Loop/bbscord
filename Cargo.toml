[workspace]
resolver = "2"
members = [
    "crates/bbs-core",
    "crates/bbs-protocol",
    "crates/bbs-runtime-term",
    "crates/bbs-voice",
    "crates/bbs-video",
    "crates/bbs-tui",
    "crates/bbscord",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bit-Loop/bbscord"

[workspace.dependencies]
# Internal workspace crates
bbs-core = { path = "crates/bbs-core" }
bbs-protocol = { path = "crates/bbs-protocol" }
bbs-runtime-term = { path = "crates/bbs-runtime-term" }
bbs-voice = { path = "crates/bbs-voice" }
bbs-video = { path = "crates/bbs-video" }
bbs-tui = { path = "crates/bbs-tui" }

# Async & core utilities
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = { version = "1", features = ["derive"] }
keyring = "4.2"
toml = "1.2"
lru = "0.19"
fuzzy-matcher = "0.3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
qrcode = { version = "0.14", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1.12"

# Terminal UI & media
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }

# Networking & Discord protocol
# Note: wreq 0.16.x requires rustc 1.98; pinned to 0.15.x (MSRV 1.85) for host rustc 1.95.0 compatibility.
wreq = { version = "0.15", features = ["json", "gzip", "brotli", "deflate", "zstd", "multipart", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Voice (DAVE E2EE + Opus + Audio I/O)
davey = "0.2"
audiopus = "0.3.0-rc.0"
cpal = "0.18"

# Video / Go Live screenshare
ashpd = "0.14"
gstreamer = "0.25"
gstreamer-webrtc = "0.25"
gstreamer-app = "0.25"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
