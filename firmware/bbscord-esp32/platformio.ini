; PlatformIO firmware configuration for bbscord 16x2 HD44780 Hardware LCD Bridge
; Targets: ESP32 (Xtensa LX6), ESP32-S3 (Xtensa LX7), ESP32-C3 (RISC-V), ESP32-C6 (RISC-V)

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -DBBSCORD_VERSION=\"1.0.0\"

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
